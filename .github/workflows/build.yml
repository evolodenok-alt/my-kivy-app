  - uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      pip install --upgrade pip
      pip install buildozer "cython<3" virtualenv

  - name: Accept Android licenses
    run: |
      SDK=~/.buildozer/android/platform/android-sdk
      mkdir -p $SDK/licenses
      echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK/licenses/android-sdk-license
      echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
      echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $SDK/licenses/android-sdk-preview-license

  - name: Build APK
    run: yes | buildozer -v android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: app-debug-apk
      path: bin/*.apk
